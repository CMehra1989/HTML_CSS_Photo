<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chetan Mehra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#f4ece0;
    --sky-soft:#fbf6ec;
    --gold:#b9873f;
    --ink:#3a2f24;
    --ink-soft:#7a6a56;
  }

  *{ box-sizing:border-box; }

  html, body{
    height:100%;
    margin:0;
  }

  body{
    display:flex;
    flex-direction:column;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky-soft) 100%);
    font-family:'Jost', sans-serif;
    color:var(--ink);
  }

  header{
    text-align:center;
    padding: 26px 20px 16px;
    flex: 0 0 auto;
  }

  header h1{
    font-family:'Libre Baskerville', serif;
    font-size: clamp(1.6rem, 3.6vw, 2.4rem);
    letter-spacing: 0.5px;
    margin: 0 0 6px;
    color: var(--ink);
  }

  header p{
    font-style: italic;
    font-family:'Libre Baskerville', serif;
    color: var(--gold);
    margin: 0;
    font-size: 1rem;
  }

  #mosaic{
    flex: 1 1 auto;
    min-height: 0;
    margin: 0 24px 20px;
    display: grid;
    gap: 10px;
    grid-template-columns: 1.05fr 1.05fr 1.3fr;
    grid-template-rows: 1fr 1fr;
    grid-template-areas:
      "a b c"
      "d e c";
    border-radius: 8px;
    overflow: hidden;
  }

  .tile{
    position: relative;
    overflow: hidden;
    background: #e8e0d2;
  }

  .tile img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.9s ease;
  }

  .tile img.show{
    opacity: 1;
  }

  .tile[data-slot="a"]{ grid-area: a; }
  .tile[data-slot="b"]{ grid-area: b; }
  .tile[data-slot="c"]{ grid-area: c; }
  .tile[data-slot="d"]{ grid-area: d; }
  .tile[data-slot="e"]{ grid-area: e; }

  #dots{
    display:flex;
    justify-content:center;
    gap: 8px;
    padding: 0 0 20px;
    flex: 0 0 auto;
  }

  #dots button{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: none;
    background: #d9c3a0;
    cursor: pointer;
    padding: 0;
    transition: background 0.2s ease, width 0.2s ease;
  }

  #dots button.active{
    background: var(--gold);
    width: 22px;
    border-radius: 5px;
  }

  #status{
    text-align:center;
    color: var(--ink-soft);
    font-style:italic;
    padding: 0 0 20px;
    font-family:'Libre Baskerville', serif;
    flex: 0 0 auto;
  }

  @media (max-width: 760px){
    #mosaic{
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      grid-template-areas:
        "a b"
        "d e"
        "c c";
      margin: 0 14px 16px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Chetan Mehra</h1>
  <p>a small wall of moments</p>
</header>

<div id="mosaic">
  <div class="tile" data-slot="a"></div>
  <div class="tile" data-slot="b"></div>
  <div class="tile" data-slot="c"></div>
  <div class="tile" data-slot="d"></div>
  <div class="tile" data-slot="e"></div>
</div>
<div id="dots"></div>
<p id="status"></p>

<script>
  // ---- Configure once here ----
  const OWNER  = "CMehra1989";
  const REPO   = "HTML_CSS_Photo";
  const BRANCH = "main";
  const PATH   = "";   // e.g. set to "images" if you move photos into an /images folder
  const AUTO_ADVANCE_MS = 4500;
  const SLOTS = ["a","b","c","d","e"];
  // ------------------------------

  const IMAGE_EXTENSIONS = [".jpg", ".jpeg", ".png", ".gif", ".webp"];
  const status = document.getElementById("status");
  const dotsWrap = document.getElementById("dots");
  const tiles = {};
  SLOTS.forEach(s => tiles[s] = document.querySelector(`.tile[data-slot="${s}"]`));

  let images = [];
  let groupIndex = 0;
  let totalGroups = 0;
  let autoTimer = null;

  function preload(src){
    return new Promise(resolve => {
      const im = new Image();
      im.onload = () => resolve();
      im.onerror = () => resolve();
      im.src = src;
    });
  }

  async function showGroup(i){
    const maxIndex = Math.max(0, totalGroups - 1);
    groupIndex = ((i % (maxIndex+1)) + (maxIndex+1)) % (maxIndex+1);
    const startIdx = groupIndex * SLOTS.length;

    for (let s = 0; s < SLOTS.length; s++){
      const slot = SLOTS[s];
      const file = images[(startIdx + s) % images.length];
      if (!file) continue;

      const srcPath = PATH ? `${PATH}/${file.name}` : file.name;
      await preload(srcPath);

      const tile = tiles[slot];
      const oldImg = tile.querySelector("img");
      const newImg = document.createElement("img");
      newImg.src = srcPath;
      newImg.alt = "A moment";
      tile.appendChild(newImg);
      requestAnimationFrame(() => newImg.classList.add("show"));

      if (oldImg){
        oldImg.classList.remove("show");
        setTimeout(() => { if(oldImg.parentNode) oldImg.remove(); }, 950);
      }
    }
    updateDots();
  }

  function updateDots(){
    dotsWrap.innerHTML = "";
    for(let i=0;i<totalGroups;i++){
      const b = document.createElement("button");
      if(i===groupIndex) b.classList.add("active");
      b.addEventListener("click", ()=>{ showGroup(i); restartAuto(); });
      dotsWrap.appendChild(b);
    }
  }

  function next(){ showGroup(groupIndex+1); }

  function restartAuto(){
    if(autoTimer) clearInterval(autoTimer);
    autoTimer = setInterval(next, AUTO_ADVANCE_MS);
  }

  const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${BRANCH}`;

  fetch(apiUrl)
    .then(res => {
      if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
      return res.json();
    })
    .then(files => {
      images = files.filter(file =>
        file.type === "file" &&
        IMAGE_EXTENSIONS.some(ext => file.name.toLowerCase().endsWith(ext))
      );

      if (images.length === 0){
        status.textContent = "No images found yet.";
        return;
      }

      totalGroups = Math.max(1, Math.ceil(images.length / SLOTS.length));
      showGroup(0);
      restartAuto();
    })
    .catch(err => {
      console.error(err);
      status.textContent = "Couldn't load the gallery right now — check back soon.";
    });
</script>

</body>
</html>
